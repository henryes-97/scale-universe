<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Escala la data en la durada de l’univers </title>

  <!-- Icona del navegador -->
  <link rel="icon" href="data:image/svg+xml,
    <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
      <text y='0.9em' font-size='90'>🌌</text>
    </svg>">

  <style>
    body {
      font-family: Arial, "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      
      background-image: url("images/background.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .subtitle {
      text-align: center;
      font-size: 0.95em;
      color: #555;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      font-size: 14px;
    }

    .button-container {
      text-align: center;
      margin-top: 25px;
    }

    button {
      padding: 10px 22px;
      font-size: 16px;
      background-color: #2c7be5;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1a5fb4;
    }

    pre {
      background: #f4f4f4;
      padding: 12px;
      margin-top: 25px;
      white-space: pre-wrap;
    }

    .lang-select {
      text-align: right;
      margin-bottom: 15px;
    }

    .lang-btn {
      font-size: 16px;
      padding: 6px 10px;
      margin-left: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      cursor: pointer;
    }

    .lang-btn:hover {
      background-color: #f0f0f0;
    }

    .lang-btn.active {
      background-color: #2c7be5;
      color: white;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 25px 30px;

      background: rgba(225, 225, 225, 0.92);
      border-radius: 14px;

      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
    }

    .flag {
      width: 22px;
      height: 16px;
      margin-right: 6px;
      vertical-align: middle;
      border-radius: 2px;
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.3);
    }

    .lang-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    @media (max-width: 600px) {
      body {
        font-size: 18px;
      }

      h2 {
        font-size: 1.6em;
      }

      .container {
        margin: 12px;
        padding: 22px;
      }

      .lang-btn {
        font-size: 16px;
        padding: 8px 12px;
      }
    }
  </style>
</head>

<body>

<div class="container">

<div class="lang-select">
  <button class="lang-btn" onclick="setLanguage('ca')" title="Català">
    <img src="flags/ca.svg" alt="Català" class="flag">
    CA
  </button>

  <button class="lang-btn" onclick="setLanguage('en')" title="English">
    <img src="flags/gb.svg" alt="English" class="flag">
    EN
  </button>
</div>

<h2 id="title">🌌</h2>
<div class="subtitle" id="subtitle"></div>

<label id="label-event"></label>
<input type="text" id="label" />

<label id="label-age"></label>
<input type="number" id="age" />

<div class="button-container">
  <button onclick="runScaler()" id="button"></button>
</div>

<pre id="output"></pre>

<script>
/* 🌍 TEXTOS */
const texts = {
  ca: {
    title: "🌌 Escala un esdeveniment a la durada de l’univers",
    subtitle: "Una metàfora temporal: tota la història de l’univers comprimida en un any",
    eventLabel: "Esdeveniment:",
    eventPlaceholder: "Què vols escalar?",
    ageLabel: "Edat en anys:",
    agePlaceholder: "Quina edat té el que vols escalar?",
    button: "Calcula",
    errEvent: "Si us plau, introdueix un nom per a l’esdeveniment. Per exemple: Descobriment del foc",
    errAge: "Si us plau, introdueix una edat vàlida. Per exemple: 502026",
    errRange: "Si us plau, introdueix una edat entre 0 i 13.835.000.000 anys.",
    output: (label, date) => `L’esdeveniment «${label}» va ocórrer el ${date} ms`,
    locale: "ca-ES"
  },
  en: {
    title: "🌌 Scale an event to the duration of the universe",
    subtitle: "A temporal metaphor: the entire history of the universe compressed into one year",
    eventLabel: "Event:",
    eventPlaceholder: "What do you want to scale?",
    ageLabel: "Age in years:",
    agePlaceholder: "How old is the event?",
    button: "Calculate",
    errEvent: "Please enter a name for the event. For example: Discovery of fire",
    errAge: "Please enter a valid age. For example: 502026",
    errRange: "Please enter an age between 0 and 13,835,000,000 years.",
    output: (label, date) => `The event “${label}” occurred on ${date} ms`,
    locale: "en-US"
  }
};

let currentLang = "ca";

/* 🌐 CANVI D’IDIOMA */
function setLanguage(lang) {
  currentLang = lang;
  const t = texts[lang];

  document.documentElement.lang = lang;
  document.title = t.title;
  document.getElementById("title").textContent = t.title;
  document.getElementById("subtitle").textContent = t.subtitle;
  document.getElementById("label-event").textContent = t.eventLabel;
  document.getElementById("label-age").textContent = t.ageLabel;
  document.getElementById("button").textContent = t.button;

  document.getElementById("label").placeholder = t.eventPlaceholder;
  document.getElementById("age").placeholder = t.agePlaceholder;

  document.getElementById("output").textContent = "";

  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.classList.remove("active");
  });

  const activeBtn = document.querySelector(
    `.lang-btn[onclick="setLanguage('${lang}')"]`
  );
  if(activeBtn) {
    activeBtn.classList.add("active");
  }
}

/* ⏱️ ESCALAT TEMPORAL (ms) */
function scaleYourAge(x) {
  const uniage = 13835 * 1e6;
  const secondsInYear = 365 * 24 * 3600;

  const remainingSeconds = (1 - x / uniage) * secondsInYear;

  const baseDate = new Date(Date.UTC(1970, 0, 1, 0, 0, 0));
  const scaledDate = new Date(baseDate.getTime() + remainingSeconds * 1000);

  const t = texts[currentLang];

  const day = scaledDate.getUTCDate().toString().padStart(2, "0");
  const month = scaledDate.toLocaleString(t.locale, {
    month: "long",
    timeZone: "UTC"
  });
  const hours = scaledDate.getUTCHours().toString().padStart(2, "0");
  const minutes = scaledDate.getUTCMinutes().toString().padStart(2, "0");
  const seconds = scaledDate.getUTCSeconds().toString().padStart(2, "0");
  const millis = scaledDate.getUTCMilliseconds().toString().padStart(3, "0");

  return `${day} ${month} ${hours}:${minutes}:${seconds}.${millis}`;
}

/* ▶️ EXECUCIÓ */
function runScaler() {
  const t = texts[currentLang];
  const label = document.getElementById("label").value.trim();
  const age = parseFloat(document.getElementById("age").value);

  if (!label) {
    document.getElementById("output").textContent = t.errEvent;
    return;
  }
  if (isNaN(age)) {
    document.getElementById("output").textContent = t.errAge;
    return;
  }
  if (age < 0 || age > 13835e6) {
    document.getElementById("output").textContent = t.errRange;
    return;
  }

  const scaled = scaleYourAge(age);
  document.getElementById("output").textContent = t.output(label, scaled);
}

/* Inicialització */
setLanguage("ca");
</script>

</div>
</body>
</html>
